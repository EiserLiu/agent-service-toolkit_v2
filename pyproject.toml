[project]
name = "agent-service-toolkit"
version = "0.1.0"
description = "Full toolkit for running an AI agent service built with LangGraph, FastAPI and Streamlit"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.12,<3.15"

dependencies = [
    "aiosqlite >=0.22.1",
    "docx2txt ~=0.8",
    "duckduckgo-search>=8.1.1",
    "fastapi ~=0.141.0",
    "httpx ~=0.28.1",
    "jiter ~=0.16.0",
    "langchain ~=1.3.11",
    "langchain-core ~=1.4.8",
    "langchain-community ~=0.4.2",
    "langchain-anthropic ~=1.4.8",
    "langchain-aws ~=1.6.1",
    "langchain-chroma ~=1.1.0",
    "langchain-google-genai ~=4.2.6",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq ~=1.1.3",
    "langchain-ollama ~=1.1.0",
    "langchain-openai ~=1.3.3",
    "langfuse ~=4.12",
    "langgraph ~=1.2.7",
    "langgraph-checkpoint-mongodb ~=0.4.0",
    "langgraph-checkpoint-postgres~=3.1.1",
    "langgraph-checkpoint-sqlite ~=3.1.0",
    "langgraph-supervisor ~=0.0.31",
    "langsmith ~=0.11.0",
    "numexpr ~=2.14.1",
    "numpy ~=2.5.0",
    "onnxruntime ~= 1.27.0",
    "pandas ~=3.0.3",
    "psycopg[binary,pool] ~=3.3.4",
    "pyarrow >=23.0.1",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.15.0",
    "pypdf>=6.14.2,<6.17.0",
    "pyowm ~=3.5.0",
    "python-dotenv ~=1.2.2",
    "setuptools ~=84.0.0",
    "streamlit ~=1.59.1",
    "tiktoken >=0.13.0",
    "uvicorn ~=0.52.0",
    "langchain-mcp-adapters>=0.3.0",
    "ddgs>=9.14.4",
    "ag-ui-langgraph~=0.0.42",
]

# 供应链冷却期：解析依赖时只考虑发布已满 14 天的版本。必须使用
# 仓库指定的 uv 版本（旧版会忽略此设置，并在重新锁定时从 uv.lock 中删除它）。
# 策略和覆盖流程见：.claude/skills/dependency-refresh/SKILL.md
[tool.uv]
exclude-newer = "14 days"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff ~=0.15.21",
    "pyrefly ~=1.1.1",
    "pymarkdownlnt",
]

# 仅运行客户端和 Streamlit 应用所需的最小依赖组。
# 这些包也包含在默认依赖中。
# 安装命令：`uv sync --frozen --only-group client`
client = [
    "httpx~=0.28.1",
    "pydantic ~=2.13.4",
    "python-dotenv ~=1.2.2",
    "streamlit~=1.59.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "U"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
OPENAI_API_KEY = "sk-fake-openai-key"

[tool.pymarkdown]
# 文档使用不按固定列宽换行的长文本，
# 因此不强制限制行长度。
plugins.md013.enabled = false
# README.md 有意使用内联 HTML（例如带 width= 的 <img>）。
plugins.md033.enabled = false
# 并非所有文档都需要以一级标题开头。
plugins.md041.enabled = false
# 允许重复的标题文字，但相邻的同级标题除外。
plugins.md024.siblings_only = true

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["src/streamlit_app.py"]
preset = "default"

[tool.pyrefly.errors]
# LangGraph 的 StateGraph(state_schema) 泛型约束不接受 MessagesState
# 的子类，因此会在每个 Agent 的 StateGraph(AgentState) 上误报。
# 这是 LangGraph 类型定义的不足，并非实际错误，因此在整个项目中禁用该检查。
bad-specialization = false
