name: Template cleanup

# 首次使用此模板创建下游仓库时，执行一次清理。
# 移除维护者专用的配套文件，提交清理结果，
# 然后删除本工作流，确保不再运行。下方的所有者检查
# 确保本工作流在源仓库中不执行任何操作。
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    # 仅在真正由模板创建的仓库中运行。仓库名称检查跳过
    # 源仓库；fork 检查跳过贡献者的 fork（它们也是下游副本，
    # 但“Use this template”创建的仓库 fork == false，而 fork 仓库 fork == true）。
    if: >-
      github.repository != 'JoshuaC215/agent-service-toolkit'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Remove maintainer scaffolding
        run: |
          set -euo pipefail

          # 整目录清理：维护者自动化配置与维护文档。
          rm -rf .claude docs/maintenance

          # 带所有者限制的工作流通过维护者所有者检查自行标识，
          # 因此新增此类工作流时无需修改列表。跳过通用
          # CI（无所有者检查的 test.yml）和本文件（最后删除）。
          guard="github.repository == 'JoshuaC215/agent-service-toolkit'"
          for wf in .github/workflows/*.yml; do
            [ "$wf" = ".github/workflows/template-cleanup.yml" ] && continue
            if grep -qF "$guard" "$wf"; then
              rm -f "$wf"
            fi
          done

          # 显式列表：共享目录中无法携带所有者检查标记的维护者专用文件。
          # 请与 CLAUDE.md 中的约定保持一致。
          # （当前为空）

          # 最后删除自身，确保此工作流不再运行。
          rm -f .github/workflows/template-cleanup.yml

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to clean up."
            exit 0
          fi
          git add -A
          git commit -m "Remove maintainer scaffolding from template instance"
          git push origin HEAD:${{ github.ref_name }}
