name: Live smoke test

# 每周通过浏览器对已部署的 Streamlit 演示应用进行完整链路测试：加载应用、
# 发送一条聊天消息，并确认助手以流式方式返回响应
# （浏览器 → Streamlit WebSocket → Agent 服务 → LLM → 原路返回）。
# 在周日维护任务前一小时运行，以便维护任务报告最新结果。
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      url:
        description: "Target app URL to smoke test (leave blank to use the script default)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    # 仅针对维护者部署的应用运行，不在模板副本或 fork 中运行
    if: github.repository == 'JoshuaC215/agent-service-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install Playwright Chromium
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Run live smoke test
        env:
          LIVE_APP_URL: ${{ github.event.inputs.url }}
        run: |
          # 定时运行时没有手动触发的输入参数，因此 LIVE_APP_URL
          # 为空字符串；将其取消设置，使脚本使用默认地址。
          # 使用显式 if（而非 `&& unset`），避免已设置地址时触发 `bash -e` 退出。
          if [ -z "${LIVE_APP_URL}" ]; then unset LIVE_APP_URL; fi
          set -o pipefail
          uv run --with playwright python scripts/smoke_live_app.py 2>&1 | tee smoke_run.log
      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Live smoke test failed"
            echo ""
            echo "Target: \`${LIVE_APP_URL:-script default}\`"
            echo ""
            echo "Diagnostics (page title, iframe count, data-testid inventory, visible text):"
            echo '```'
            diag=$(grep '\[smoke_live_app\]' smoke_run.log 2>/dev/null | tail -n 40)
            echo "${diag:-(no diagnostic lines captured)}"
            echo '```'
            echo ""
            echo "📸 Full-page screenshot: download the **smoke-live-app-failure** artifact below."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          LIVE_APP_URL: ${{ github.event.inputs.url }}
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-live-app-failure
          path: smoke_live_app_failure.png
          if-no-files-found: warn
